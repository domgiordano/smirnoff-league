name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: read # wait-for-terraform finds the Terraform run on this commit

jobs:
  wait-for-terraform:
    uses: ./.github/workflows/wait-for-terraform.yml

  deploy:
    needs: wait-for-terraform
    uses: Xomware/github-actions/.github/workflows/deploy-frontend-s3.yml@v1
    with:
      app: smirnoff
      role-key: AWS_DEPLOY_ROLE_ARN
      node-version: '22'
      root: frontend
      ssm: |
        NEXT_PUBLIC_COGNITO_USER_POOL_ID=/xomware/shared/cognito/user-pool-id
        NEXT_PUBLIC_COGNITO_CLIENT_ID=/xomware/shared/cognito/clients/smirnoff-id
        NEXT_PUBLIC_API_URL=/smirnoff/api-url
      build-command: |
        export NEXT_PUBLIC_COGNITO_DOMAIN=auth.smirnoff-league.com
        REQUIRE_AUTH_ENV=1 npm run build
      dist-dir: out
      bucket: smirnoff-league.com
      domain: smirnoff-league.com
      nextjs: true
